name: Control diario (ntfy)

on:
  schedule:
    # Un solo recordatorio por día hábil, entregado 18:00 AR en punto.
    # Corre ~35 min antes (17:25 AR = 20:25 UTC) porque GitHub Actions no es
    # puntual; la entrega exacta la hace ntfy con el header "At:".
    - cron: "25 20 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notificar jornadas pendientes (skip fin de semana)
        env:
          TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://thomasloekemeyer.github.io/sueldo-tracker/
          SB_URL: https://ljwlanwmnuqgxftlirhh.supabase.co
          SB_KEY: sb_publishable_niVre5BYps9QZVh4qq0UtQ_mMmCrIV0
        run: |
          # Skip fin de semana en hora AR
          DOW_AR=$(TZ=America/Argentina/Buenos_Aires date +%u)
          if [ "$DOW_AR" -gt 5 ]; then
            echo "Fin de semana AR (DOW=$DOW_AR), skip."
            exit 0
          fi

          TODAY=$(TZ=America/Argentina/Buenos_Aires date +%Y-%m-%d)
          NOW=$(date +%s)

          # Entrega exacta 18:00 AR; si el run se atrasó hasta pasada esa
          # hora, entregar de inmediato (ntfy rechaza "At" en el pasado).
          TARGET=$(date -d "${TODAY}T18:00:00-03:00" +%s)
          DELAY_HEADER=()
          if [ $(( TARGET - NOW )) -gt 60 ]; then
            DELAY_HEADER=(-H "At: ${TARGET}")
          fi

          # Última jornada registrada. Si Supabase no responde, avisar en
          # vez de fallar en silencio.
          if ! RAW=$(curl -fsS \
            -H "apikey: ${SB_KEY}" \
            -H "Authorization: Bearer ${SB_KEY}" \
            "${SB_URL}/rest/v1/movimientos?select=fecha&tipo=eq.horas&order=fecha.desc&limit=1"); then
            echo "::error::Supabase no responde (${SB_URL})"
            curl -fsS -X POST "https://ntfy.sh/${TOPIC}" \
              -H "Title: Recordatorios rotos" \
              -H "Priority: high" \
              -H "Tags: warning" \
              -d "No pude consultar Supabase para chequear jornadas pendientes. Revisar si el proyecto está pausado." || true
            exit 1
          fi
          LAST=$(echo "$RAW" | jq -r '.[0].fecha // ""')

          # Día de inicio: day after last, o today si no hay ninguna
          if [ -z "$LAST" ]; then
            START="$TODAY"
          else
            LAST_DATE=$(echo "$LAST" | cut -d'T' -f1)
            START=$(date -d "$LAST_DATE + 1 day" +%Y-%m-%d)
          fi

          # Listar días hábiles pendientes de START a TODAY
          PENDING_LIST=""
          PENDING_COUNT=0
          D="$START"
          END=$(date -d "$TODAY + 1 day" +%Y-%m-%d)
          while [[ "$D" < "$END" ]]; do
            DOW=$(date -d "$D" +%u)
            if [ "$DOW" -le 5 ]; then
              DMY=$(date -d "$D" +%d/%m)
              if [ -z "$PENDING_LIST" ]; then
                PENDING_LIST="$DMY"
              else
                PENDING_LIST="${PENDING_LIST}, ${DMY}"
              fi
              PENDING_COUNT=$((PENDING_COUNT + 1))
            fi
            D=$(date -d "$D + 1 day" +%Y-%m-%d)
          done

          echo "AR ${TODAY} — pendientes: ${PENDING_COUNT} (${PENDING_LIST})"

          if [ "$PENDING_COUNT" -eq 0 ]; then
            echo "Sin jornadas pendientes."
            exit 0
          fi

          if [ "$PENDING_COUNT" -eq 1 ]; then
            TITLE="Trabajo ${PENDING_LIST}"
            BODY="Trabajaste 9 a 18hs?"
          else
            TITLE="${PENDING_COUNT} jornadas pendientes"
            BODY="Faltan: ${PENDING_LIST}. Confirmar registra todas."
          fi

          curl -fsS -X POST "https://ntfy.sh/${TOPIC}" \
            "${DELAY_HEADER[@]}" \
            -H "Title: ${TITLE}" \
            -H "Priority: high" \
            -H "Tags: briefcase,alarm_clock" \
            -H "Click: ${APP_URL}" \
            -H "Actions: view, Confirmar, ${APP_URL}?action=confirmar, clear=true; view, Editar, ${APP_URL}?action=editar, clear=true" \
            -d "${BODY}"
